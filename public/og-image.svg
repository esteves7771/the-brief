<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#080809"/>

  <!-- Subtle grid texture -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Amber accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f5c550"/>
      <stop offset="100%" style="stop-color:#e8833a"/>
    </linearGradient>
  </defs>

  <!-- Wordmark -->
  <text x="600" y="265" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="-4">The</text>
  <text x="600" y="390" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#f5c550" text-anchor="middle" letter-spacing="-4">Brief</text>

  <!-- Tagline -->
  <text x="600" y="460" font-family="monospace" font-size="22" fill="#334155" text-anchor="middle" letter-spacing="8">LIVE NEWS AGGREGATOR</text>

  <!-- Sources row -->
  <text x="600" y="530" font-family="monospace" font-size="16" fill="#1e293b" text-anchor="middle" letter-spacing="3">BBC · REUTERS · AL JAZEERA · TECHCRUNCH · NYT · SKY NEWS</text>

  <!-- Domain -->
  <text x="600" y="600" font-family="monospace" font-size="18" fill="#334155" text-anchor="middle" letter-spacing="4">thebriefnews.org</text>
</svg>
