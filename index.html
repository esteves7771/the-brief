<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── PRIMARY META ─────────────────────────────────────────────────── -->
    <title>The Brief — Live News, Breaking Stories & Top Headlines</title>
    <meta name="description" content="The Brief is a free live news aggregator pulling breaking stories from BBC, Reuters, Al Jazeera, TechCrunch and more. Top stories, world news, tech, business, science, sports, cars and motorcycles — all in one place." />
    <meta name="keywords" content="news, breaking news, live news, top stories, world news, tech news, business news, BBC news, Reuters, Al Jazeera, TechCrunch, news aggregator" />
    <meta name="author" content="Pedro Esteves" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://thebriefnews.org" />

    <!-- ─── OPEN GRAPH (Facebook, WhatsApp, LinkedIn) ────────────────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Brief" />
    <meta property="og:title" content="The Brief — Live News & Breaking Stories" />
    <meta property="og:description" content="Free live news aggregator. Breaking stories from BBC, Reuters, Al Jazeera, TechCrunch and more. Updated continuously." />
    <meta property="og:url" content="https://thebriefnews.org" />
    <meta property="og:image" content="https://thebriefnews.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ─── TWITTER / X CARD ─────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Brief — Live News & Breaking Stories" />
    <meta name="twitter:description" content="Free live news aggregator. Breaking stories from BBC, Reuters, Al Jazeera, TechCrunch and more." />
    <meta name="twitter:image" content="https://thebriefnews.org/og-image.png" />

    <!-- ─── THEME & APP META ──────────────────────────────────────────────── -->
    <meta name="theme-color" content="#080809" />
    <meta name="application-name" content="The Brief" />
    <meta name="apple-mobile-web-app-title" content="The Brief" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- ─── FAVICON ───────────────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ─── STRUCTURED DATA (Google Rich Results) ────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "The Brief",
      "description": "Free live news aggregator pulling breaking stories from top global sources.",
      "url": "https://thebriefnews.org",
      "author": {
        "@type": "Person",
        "name": "Pedro Esteves"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://thebriefnews.org/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ─── GOOGLE ADSENSE ────────────────────────────────────────────────── -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3779766735111739"
     crossorigin="anonymous"></script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
